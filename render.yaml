services:
  - type: web
    name: storyarc-backend
    env: node
    plan: starter
    region: frankfurt
    branch: prod
    rootDir: .
    buildCommand: |
      npm ci
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: |
      node --env-file=.env dist/main.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
